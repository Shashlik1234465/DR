    b.className = 'tool' + (id === G.selUnit && G.mode === 'attack' ? ' selected' : '');
    b.innerHTML = `<span class="t-key">${u.key}</span>${SVG[id]}<div class="t-name">${uname(id)}</div>`;
    b.onclick = () => selectUnit(id);
    tu.appendChild(b);
  });
  const tp = $('tb-pvo');
  tp.innerHTML = '';
  Object.keys(PVOS).forEach(id => {
    const p = PVOS[id];
    const b = document.createElement('div');
    b.className = 'tool pvo' + (id === G.selPvo && G.mode === 'pvo' ? ' selected' : '');
    b.innerHTML = `<span class="t-key">${p.key}</span>${SVG[id]}<div class="t-name">${pname(id)}</div>`;
    b.onclick = () => selectPvo(id);
    tp.appendChild(b);
  });
}
function selectUnit(id) {
  G.selUnit = id; G.mode = 'attack';
  Sound.click(); buildToolbar(); refreshHudMode(); refreshHint();
}
function selectPvo(id) {
  G.selPvo = id; G.mode = 'pvo';
  Sound.click(); buildToolbar(); refreshHudMode(); refreshHint();
}
function refreshHudMode() {
  $('hud-mode').textContent = G.mode === 'attack'
    ? ('ATTACK :: ' + uname(G.selUnit))
    : ('DEFENSE :: ' + pname(G.selPvo));
}
function toggleAuto() {
  G.autoWave = !G.autoWave;
  const b = $('btn-auto');
  b.classList.toggle('on', G.autoWave);
  b.textContent = L(G.autoWave ? 't_auto_on' : 't_auto_off');
  Sound.click();
  log(L(G.autoWave ? 'lg_auto_on' : 'lg_auto_off'));
}
function toggleSound() {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  $('btn-sound-game').classList.toggle('off', Sound.muted);
}
function togglePause() {
  if (!G.running) return;
  G.paused = !G.paused;
  $('pause-overlay').classList.toggle('hidden', !G.paused);
  Sound.click();
}
function resetMap() {
  Sound.click();
  log(L('lg_reset'), 'warn');
  buildWorld(G.mapId);
  G.stats = { launched: 0, killed: 0, shots: 0, hits: 0, dest: 0 };
  updateStats();
}
function showScreen(id) {
  ['screen-menu', 'screen-brief', 'screen-game', 'screen-garage'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}
function startBattle() {
  Sound.init(); Sound.resume(); Sound.click();
  if (!renderer || !scene) return;
  buildWorld(G.mapId);
  G.stats = { launched: 0, killed: 0, shots: 0, hits: 0, dest: 0 };
  updateStats();
  G.running = true;
  G.paused = false;
  G.garageOpen = false;
  G.startTime = performance.now();
  G.waveTimer = 3;
  logEl.innerHTML = '';
  log(L('lg_start', MAPS[G.mapId].name), 'good');
  $('hud-map').textContent = MAPS[G.mapId].name;
  buildToolbar();
  refreshHudMode();
  refreshHint();
  showScreen('screen-game');
}
function quitToMenu() {
  G.running = false;
  G.paused = false;
  $('pause-overlay').classList.add('hidden');
  showScreen('screen-menu');
  Sound.click();
}
function syncSettingsUI() {
  const mark = (id, val) => {
    const el = $(id);
    if (!el) return;
    [...el.children].forEach(b => b.classList.toggle('sel', b.dataset.val === String(val)));
  };
  mark('seg-quality', G.set.quality);
  mark('seg-shadows', G.set.shadows ? 1 : 0);
  mark('seg-bloom', G.set.bloom ? 1 : 0);
  mark('seg-fx', G.set.fx);
  mark('seg-destruct', G.set.destruct);
  mark('seg-lang', LANG);
}
function bindSeg(id, fn) {
  const el = $(id);
  if (!el) return;
  [...el.children].forEach(b => b.onclick = () => {
    Sound.click();
    fn(b.dataset.val);
    syncSettingsUI();
  });
}
bindSeg('seg-quality', v => { G.set.quality = v; applyQuality(); });
bindSeg('seg-shadows', v => { G.set.shadows = v === '1'; applyShadows(); });
bindSeg('seg-bloom', v => { G.set.bloom = v === '1'; });
bindSeg('seg-fx', v => { G.set.fx = parseFloat(v); });
bindSeg('seg-destruct', v => { G.set.destruct = parseFloat(v); });
bindSeg('seg-lang', v => { LANG = v; G.set.lang = v; applyLang(); });

$('btn-play').onclick = () => { Sound.init(); Sound.resume(); Sound.click(); buildBriefUI(); showScreen('screen-brief'); };
$('btn-garage').onclick = openGarage;
$('garage-back').onclick = closeGarage;
$('btn-settings').onclick = () => { Sound.click(); $('settings-modal').classList.remove('hidden'); syncSettingsUI(); };
$('btn-settings-p').onclick = () => { Sound.click(); $('settings-modal').classList.remove('hidden'); syncSettingsUI(); };
$('btn-set-close').onclick = () => { Sound.click(); $('settings-modal').classList.add('hidden'); };
$('btn-help').onclick = () => { Sound.click(); $('help-modal').classList.remove('hidden'); };
$('btn-help-close').onclick = () => { Sound.click(); $('help-modal').classList.add('hidden'); };
$('btn-sound-menu').onclick = toggleSound;
$('btn-back-menu').onclick = () => { Sound.click(); showScreen('screen-menu'); };
$('btn-start').onclick = startBattle;
$('btn-pause').onclick = togglePause;
$('btn-resume').onclick = togglePause;
$('btn-quit').onclick = quitToMenu;
$('btn-quit2').onclick = quitToMenu;
$('btn-reset').onclick = resetMap;
$('btn-sound-game').onclick = toggleSound;
$('btn-auto').onclick = toggleAuto;

/* v7.1: подсказка поворота устройства */
let rotDismissed = false;
function updateRotateHint() {
  const portrait = window.innerHeight > window.innerWidth;
  if (!portrait) rotDismissed = false;
  const show = IS_TOUCH && portrait && !rotDismissed;
  $('rotate-overlay').classList.toggle('hidden', !show);
}
$('btn-rot-dismiss').onclick = () => { rotDismissed = true; updateRotateHint(); Sound.click(); };
window.addEventListener('orientationchange', () => setTimeout(updateRotateHint, 200));

/* ============================ ГЛАВНЫЙ ЦИКЛ ============================ */
let lastT = performance.now(), statTimer = 0, fpsAcc = 0, fpsN = 0;
function animate() {
  requestAnimationFrame(animate);
  if (!renderer) return;
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (G.garageOpen && garageScene && garageCam) {
    if (garageModel) garageModel.rotation.y += dt * 0.35;
    const sp = Math.sin(G.garagePitch), cp = Math.cos(G.garagePitch);
    garageCam.position.set(
      G.garageDist * sp * Math.sin(G.garageYaw),
      G.garageDist * cp + 1.5,
      G.garageDist * sp * Math.cos(G.garageYaw));
    garageCam.lookAt(0, 2, 0);
    renderer.render(garageScene, garageCam);
    return;
  }
  if (G.running && !G.paused) {
    updateEvents(dt);
    updateWaves(dt);
    updatePvo(dt);
    updateFlyers(dt);
    updateInterceptors(dt);
    updateBursts(dt);
    updateSoldiers(dt);
    updateCivilians(dt, now);
    updateParticles(dt);
    updatePoolFires(dt, now);
    let drones = 0, jets = 0;
    G.flyers.forEach(f => { if (f.type === 'fpv' || f.type === 'shahed') drones++; else jets++; });
    jets += G.interceptors.length;
    Sound.loops(drones * 0.07, jets * 0.05, Math.min(0.4, G.poolFires.length * 0.09));
    statTimer += dt;
    if (statTimer > 0.25) { statTimer = 0; updateStats(); }
    if (hoverDirty && now - lastHoverT > 80) { lastHoverT = now; hoverDirty = false; updateHover(); }
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 2) {
      const fps = fpsN / fpsAcc;
      if (fps < 36) {
        G.qScale = Math.max(0.35, G.qScale - 0.25);
        if (fps < 24) renderer.setPixelRatio(1);
      } else if (fps > 55) {
        G.qScale = Math.min(1, G.qScale + 0.15);
      }
      $('perf').textContent = `FPS: ${Math.round(fps)} // Q: ${Math.round(G.qScale * 100)}% // CIV: ${G.civilians.length} // SOLD: ${G.soldiers.length} // FIRE: ${G.poolFires.length}`;
      fpsAcc = 0; fpsN = 0;
    }
  }
  if (G.running) {
    if (now - lastInteract > 9000 && !dragging && !pinching) camTheta += dt * 0.02;
    shake = Math.max(0, shake - dt * 2.2);
    const sx = (Math.random() - 0.5) * shake * 2.4;
    const sy = (Math.random() - 0.5) * shake * 2.4;
    const sp = Math.sin(camPhi), cp = Math.cos(camPhi);
    camera.position.set(
      camTarget.x + camDist * sp * Math.sin(camTheta) + sx,
      camTarget.y + camDist * cp + sy,
      camTarget.z + camDist * sp * Math.cos(camTheta) + sx * 0.5);
    camera.lookAt(camTarget.x + sx * 0.4, camTarget.y + sy * 0.4, camTarget.z);
    if (G.reticle && G.reticle.visible) {
      const k = 1 + Math.sin(now * 0.006) * 0.15;
      G.reticle.scale.set(k, 1, k);
      G.reticle.rotation.z += dt * 0.8;
    }
    if (composer && G.set.bloom) composer.render();
    else renderer.render(scene, camera);
  }
}
applyQuality();
applyLang();
updateRotateHint();
animate();
</script>
