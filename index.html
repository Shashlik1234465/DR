<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DRONE'S PLAYGROUND — Война Беспилотников: ПВО против Роя</title>
<style>
@import url('https://cdn.jsdelivr.net/fontsource/css/russo-one@latest/index.css');
@import url('https://cdn.jsdelivr.net/fontsource/css/play@latest/index.css');
:root{
  --acid:#c8ff00;
  --acid-dim:rgba(200,255,0,.25);
  --orange:#ff6a00;
  --red:#ff3b3b;
  --bg:#07090a;
  --panel:rgba(8,12,9,.86);
  --panel2:rgba(14,18,12,.92);
  --txt:#d8e6c8;
  --cut:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Play',sans-serif;color:var(--txt);overscroll-behavior:none;position:fixed;inset:0}
h1,h2,h3,.russo{font-family:'Russo One',sans-serif;font-weight:400}
button{font-family:'Russo One',sans-serif;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none !important}
#three-container{position:fixed;inset:0;z-index:0}
#three-container canvas{display:block;touch-action:none}
#scanlines{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.07;
  background:repeating-linear-gradient(0deg,transparent 0 2px,#000 2px 4px);
  animation:flick 7s infinite}
@keyframes flick{0%,100%{opacity:.07}92%{opacity:.07}93%{opacity:.13}94%{opacity:.05}95%{opacity:.1}}
#vignette{position:fixed;inset:0;z-index:59;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:fixed;inset:0;z-index:58;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 60%,rgba(255,190,90,.9),rgba(255,90,0,.45) 45%,transparent 75%);
  transition:opacity .45s ease-out}
.screen{position:fixed;inset:0;z-index:10}
#screen-game{pointer-events:none;z-index:12}
#screen-game > *{pointer-events:auto}
#screen-garage{pointer-events:none;z-index:11;background:radial-gradient(ellipse at 50% 45%,rgba(6,10,6,.25) 0%,rgba(4,6,4,.88) 78%)}
#screen-garage > *{pointer-events:auto}
#screen-brief,#garage-left,#garage-right,.modal-box{touch-action:pan-y}
.menu-bg{position:absolute;inset:0;overflow:hidden}
.menu-bg img{width:100%;height:100%;object-fit:cover;animation:kenburns 36s ease-in-out infinite alternate;filter:saturate(1.15) contrast(1.08)}
@keyframes kenburns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.18) translate(-2%,-3%)}}
.menu-shade{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,6,4,.78) 0%,rgba(4,6,4,.35) 40%,rgba(4,6,4,.88) 100%)}
.menu-grid{position:absolute;inset:0;opacity:.14;
  background-image:linear-gradient(rgba(200,255,0,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(200,255,0,.35) 1px,transparent 1px);
  background-size:60px 60px;animation:gridmove 12s linear infinite}
@keyframes gridmove{0%{background-position:0 0}100%{background-position:0 60px}}
.menu-content{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 8vw}
.menu-tag{font-size:13px;letter-spacing:5px;color:var(--acid);border:1px solid var(--acid-dim);padding:6px 14px;background:rgba(0,0,0,.5);clip-path:var(--cut);margin-bottom:22px;animation:tagblink 3s infinite}
@keyframes tagblink{0%,100%{opacity:1}50%{opacity:.55}}
.game-title{font-size:clamp(44px,7.5vw,110px);line-height:.95;color:#fff;text-shadow:0 0 30px rgba(200,255,0,.35),0 4px 0 #000;letter-spacing:2px}
.game-title span{color:var(--acid);text-shadow:0 0 40px rgba(200,255,0,.8)}
.menu-sub{margin-top:14px;font-size:clamp(13px,1.5vw,20px);letter-spacing:6px;color:#ffb35c;text-shadow:0 0 12px rgba(255,106,0,.6)}
.menu-buttons{margin-top:34px;display:flex;flex-direction:column;gap:12px;width:min(430px,82vw)}
.btn{position:relative;padding:15px 26px;font-size:16px;letter-spacing:3px;color:var(--acid);background:var(--panel);border:1px solid var(--acid-dim);clip-path:var(--cut);transition:.18s;text-align:left}
.btn:hover{background:rgba(200,255,0,.14);color:#fff;transform:translateX(6px);box-shadow:0 0 24px rgba(200,255,0,.25)}
.btn-main{background:linear-gradient(90deg,rgba(200,255,0,.22),rgba(200,255,0,.05));font-size:20px;padding:19px 26px;border-color:var(--acid)}
.btn-main:hover{background:var(--acid);color:#0a0f00;text-shadow:none}
.btn-small{padding:8px 14px;font-size:12px;letter-spacing:2px}
.menu-footer{position:absolute;bottom:26px;left:8vw;right:8vw;display:flex;justify-content:space-between;font-size:11px;letter-spacing:3px;color:rgba(216,230,200,.5)}
.menu-ver{color:var(--acid)}
#screen-brief{overflow-y:auto;background:linear-gradient(rgba(5,7,5,.93),rgba(5,7,5,.97)),url('https://image.qwenlm.ai/public_source/07573c72-0702-4997-939e-fee33be73d71/1bd6884ba-afa1-4d49-b1c2-8ab21005eac3.png') center/cover fixed}
.brief-wrap{max-width:1500px;margin:0 auto;padding:34px 30px 60px}
.brief-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brief-title{font-size:clamp(24px,3vw,42px);color:#fff;letter-spacing:3px}
.brief-title b{color:var(--acid)}
.section-h{display:flex;align-items:center;gap:14px;margin:30px 0 14px;font-size:15px;letter-spacing:4px;color:var(--orange)}
.section-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--acid-dim),transparent)}
.section-h .num{color:var(--acid);font-size:20px}
.map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.map-grid{grid-template-columns:repeat(2,1fr)}}
.map-card{position:relative;clip-path:var(--cut);background:var(--panel2);border:1px solid rgba(200,255,0,.15);overflow:hidden;cursor:pointer;transition:.2s}
.map-card:hover{transform:translateY(-5px);border-color:var(--acid-dim)}
.map-card.selected{border:1px solid var(--acid);box-shadow:0 0 0 1px var(--acid),0 0 30px rgba(200,255,0,.3)}
.map-card img{width:100%;height:150px;object-fit:cover;filter:saturate(.9) contrast(1.1);transition:.3s}
.map-card:hover img{filter:saturate(1.2) contrast(1.15);transform:scale(1.06)}
.map-card .mc-body{padding:12px 14px 14px}
.map-card .mc-name{font-family:'Russo One';font-size:15px;color:#fff;letter-spacing:1px}
.map-card .mc-desc{font-size:11.5px;color:rgba(216,230,200,.65);margin-top:6px;line-height:1.45}
.map-card .mc-tag{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:2px;padding:4px 8px;background:rgba(0,0,0,.65);color:var(--acid);border:1px solid var(--acid-dim)}
.map-card.selected::after{content:'✓';position:absolute;top:10px;right:10px;font-size:12px;padding:4px 8px;background:var(--acid);color:#0a0f00;font-family:'Russo One'}
.unit-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
@media(max-width:1300px){.unit-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.unit-row{grid-template-columns:repeat(2,1fr)}}
.unit-card{clip-path:var(--cut);background:var(--panel2);border:1px solid rgba(255,106,0,.18);padding:14px;cursor:pointer;transition:.2s;position:relative}
.unit-card:hover{transform:translateY(-4px);border-color:rgba(255,106,0,.6)}
.unit-card.selected{border:1px solid var(--orange);box-shadow:0 0 0 1px var(--orange),0 0 26px rgba(255,106,0,.35)}
.unit-card .key{position:absolute;top:8px;right:10px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#0a0f00;background:var(--orange);font-family:'Russo One'}
.unit-card svg{width:100%;height:56px;color:#e8f0da;opacity:.9}
.unit-card .uc-name{font-family:'Russo One';font-size:13.5px;color:#fff;margin-top:8px;letter-spacing:.5px}
.unit-card .uc-desc{font-size:10.5px;color:rgba(216,230,200,.6);margin:5px 0 8px;line-height:1.4;min-height:29px}
.stat-line{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:9.5px;letter-spacing:1px;color:rgba(216,230,200,.55)}
.bar{flex:1;height:4px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--acid))}
.pvo-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.pvo-row{grid-template-columns:repeat(2,1fr)}}
.pvo-card{clip-path:var(--cut);background:var(--panel2);border:1px solid rgba(0,200,120,.2);padding:14px;cursor:pointer;transition:.2s;position:relative;display:flex;gap:14px;align-items:center}
.pvo-card:hover{transform:translateY(-4px);border-color:rgba(0,255,140,.6)}
.pvo-card.selected{border:1px solid #00ff8c;box-shadow:0 0 0 1px #00ff8c,0 0 26px rgba(0,255,140,.3)}
.pvo-card .key{position:absolute;top:8px;right:10px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#0a0f00;background:#00ff8c;font-family:'Russo One'}
.pvo-card svg{width:60px;height:44px;flex:none;color:#cfe8d8}
.pvo-card .uc-name{font-family:'Russo One';font-size:13px;color:#fff}
.pvo-card .uc-desc{font-size:10.5px;color:rgba(216,230,200,.6);margin:4px 0 6px;line-height:1.4}
.brief-actions{display:flex;gap:16px;margin-top:38px;align-items:center;flex-wrap:wrap}
#btn-start{font-size:22px;padding:20px 46px;background:linear-gradient(90deg,rgba(255,106,0,.3),rgba(200,255,0,.15));border-color:var(--orange);color:#ffd9a0}
#btn-start:hover{background:var(--orange);color:#140800}
#hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));gap:10px;pointer-events:none}
#hud-top > *{pointer-events:auto}
.hud-panel{background:var(--panel);border:1px solid var(--acid-dim);clip-path:var(--cut);padding:10px 18px}
#hud-map{font-family:'Russo One';font-size:15px;color:var(--acid);letter-spacing:2px}
#hud-map small{display:block;font-family:'Play';font-size:10px;color:rgba(216,230,200,.55);letter-spacing:2px;margin-top:3px}
#hud-stats{display:flex;gap:26px;text-align:center}
.hstat b{display:block;font-family:'Russo One';font-size:22px;color:#fff}
.hstat span{font-size:9.5px;letter-spacing:2px;color:rgba(216,230,200,.55)}
.hstat.kill b{color:var(--acid)}
.hstat.dest b{color:var(--red)}
#hud-btns{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--acid-dim);clip-path:var(--cut);color:var(--acid);font-size:16px;transition:.15s}
.icon-btn:hover{background:rgba(200,255,0,.18);color:#fff}
.icon-btn.off{color:var(--red);border-color:rgba(255,59,59,.4)}
#log{position:absolute;top:80px;right:calc(14px + env(safe-area-inset-right));width:340px;max-height:38vh;overflow:hidden;display:flex;flex-direction:column;gap:4px;pointer-events:none;mask-image:linear-gradient(180deg,transparent 0,#000 12%)}
.log-line{font-size:11px;line-height:1.4;padding:6px 10px;background:rgba(5,8,4,.72);border-left:3px solid var(--acid);color:rgba(230,240,215,.85);animation:login .25s ease-out}
.log-line.warn{border-color:var(--orange);color:#ffcf9a}
.log-line.bad{border-color:var(--red);color:#ff9a9a}
.log-line.good{border-color:#00ff8c;color:#a8ffd0}
.log-line .lt{color:rgba(200,255,0,.6);margin-right:6px;font-size:10px}
@keyframes login{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#toolbar{position:absolute;left:0;right:0;bottom:0;padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;gap:14px;align-items:flex-end;justify-content:center;flex-wrap:wrap;background:linear-gradient(0deg,rgba(3,5,3,.9),transparent)}
.tb-group{display:flex;gap:8px;align-items:flex-end}
.tb-label{font-size:10px;letter-spacing:3px;color:rgba(216,230,200,.5);writing-mode:vertical-rl;transform:rotate(180deg);margin-bottom:4px}
.tool{position:relative;width:80px;padding:9px 6px 8px;background:var(--panel);border:1px solid rgba(200,255,0,.15);clip-path:var(--cut);cursor:pointer;transition:.15s;text-align:center}
.tool:hover{transform:translateY(-4px);border-color:var(--acid-dim)}
.tool.selected{border:1px solid var(--acid);background:rgba(200,255,0,.14);box-shadow:0 0 18px rgba(200,255,0,.25)}
.tool.pvo.selected{border-color:#00ff8c;background:rgba(0,255,140,.12);box-shadow:0 0 18px rgba(0,255,140,.25)}
.tool svg{width:50px;height:32px;color:#e8f0da}
.tool .t-name{font-family:'Russo One';font-size:8px;letter-spacing:.3px;color:#fff;margin-top:5px;line-height:1.25}
.tool .t-key{position:absolute;top:4px;left:5px;font-size:9px;color:#0a0f00;background:var(--acid);width:15px;height:15px;line-height:15px;font-family:'Russo One'}
.tool.pvo .t-key{background:#00ff8c}
#btn-auto{padding:12px 18px;font-size:12px;letter-spacing:2px;color:var(--red);border-color:rgba(255,59,59,.4)}
#btn-auto.on{color:#0a0f00;background:var(--acid);border-color:var(--acid)}
#hint{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:2px;color:var(--acid);background:rgba(5,8,4,.75);border:1px solid var(--acid-dim);padding:8px 20px;clip-path:var(--cut);pointer-events:none;white-space:nowrap}
#hint.lock{color:#ff8060;border-color:rgba(255,80,40,.5)}
#perf{position:absolute;top:80px;left:calc(14px + env(safe-area-inset-left));font-size:10px;letter-spacing:2px;color:rgba(200,255,0,.6);background:rgba(5,8,4,.6);padding:5px 10px;pointer-events:none}
#garage-wrap{position:absolute;inset:0;display:flex;gap:16px;padding:76px 24px 44px;pointer-events:none}
#garage-left{width:250px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:4px;pointer-events:auto}
#garage-left .g-tab{font-size:11px;letter-spacing:3px;color:var(--orange);margin:6px 0 2px}
.g-item{clip-path:var(--cut);background:var(--panel);border:1px solid rgba(200,255,0,.15);padding:10px 12px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px}
.g-item:hover{border-color:var(--acid-dim);transform:translateX(4px)}
.g-item.selected{border:1px solid var(--acid);background:rgba(200,255,0,.12)}
.g-item svg{width:44px;height:28px;flex:none;color:#e8f0da}
.g-item .gi-name{font-family:'Russo One';font-size:11px;color:#fff;line-height:1.3}
.g-item .gi-role{font-size:9px;color:rgba(216,230,200,.55);letter-spacing:1px}
#garage-right{width:330px;margin-left:auto;background:var(--panel2);border:1px solid var(--acid-dim);clip-path:var(--cut);padding:22px 24px;overflow-y:auto;align-self:flex-start;max-height:calc(100vh - 140px);pointer-events:auto}
#garage-right h2{color:var(--acid);font-size:22px;letter-spacing:2px}
#garage-right .gr-role{font-size:11px;letter-spacing:2px;color:var(--orange);margin:6px 0 14px}
#garage-right .gr-desc{font-size:12.5px;line-height:1.65;color:rgba(230,240,215,.85);margin-bottom:16px}
.gr-stat{margin-bottom:10px}
.gr-stat .gs-head{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:rgba(216,230,200,.6);margin-bottom:4px}
.gr-stat .gs-head b{color:var(--acid)}
.gr-specs{margin-top:14px;border-top:1px solid rgba(200,255,0,.15);padding-top:12px;font-size:11.5px;line-height:1.8;color:rgba(230,240,215,.8)}
.gr-specs span{color:var(--acid)}
#garage-top{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#garage-top h1{font-size:34px;color:#fff;letter-spacing:6px;text-shadow:0 0 24px rgba(200,255,0,.4)}
#garage-top small{font-size:10px;letter-spacing:4px;color:rgba(216,230,200,.6)}
#garage-back{position:absolute;top:20px;left:24px;z-index:6}
#garage-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:3px;color:rgba(216,230,200,.5);pointer-events:none}
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,4,2,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.modal-box{width:min(680px,92vw);max-height:86vh;overflow-y:auto;background:var(--panel2);border:1px solid var(--acid-dim);clip-path:var(--cut);padding:34px 40px}
.modal-box.wide{width:min(760px,94vw)}
.modal-box h2{color:var(--acid);font-size:26px;letter-spacing:3px;margin-bottom:18px}
.modal-box p,.modal-box li{font-size:13.5px;line-height:1.75;color:rgba(230,240,215,.85)}
.modal-box ul{list-style:none;margin:10px 0}
.modal-box li b{color:var(--orange);font-family:'Russo One';font-size:12px}
.modal-actions{margin-top:26px;display:flex;gap:12px}
.pause-title{font-size:44px;color:#fff;letter-spacing:6px;text-align:center}
.set-sec{margin-bottom:22px;border:1px solid rgba(200,255,0,.12);clip-path:var(--cut);padding:16px 18px;background:rgba(0,0,0,.25)}
.set-head{font-family:'Russo One';font-size:14px;letter-spacing:3px;color:var(--orange);margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.set-row .sl{font-size:12px;letter-spacing:1.5px;color:rgba(230,240,215,.8)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 14px;font-size:11px;letter-spacing:1.5px;background:rgba(200,255,0,.06);border:1px solid rgba(200,255,0,.2);color:rgba(230,240,215,.75);clip-path:var(--cut);transition:.15s}
.seg button:hover{color:#fff;border-color:var(--acid-dim)}
.seg button.sel{background:var(--acid);color:#0a0f00;border-color:var(--acid)}
/* ============ СЕНСОР: крупные.tap-зоны ============ */
body.touch .seg button{padding:10px 18px}
body.touch .icon-btn{width:46px;height:46px}
body.touch .g-item{padding:12px 14px}
body.touch .btn-small{padding:10px 16px}
/* ============ ЭКРАН «ПОВЕРНИ ГОРИЗОНТАЛЬНО» ============ */
#rotate-overlay{position:fixed;inset:0;z-index:70;background:rgba(4,6,4,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#rotate-overlay .ro-icon{font-size:54px;animation:rospin 2.4s ease-in-out infinite}
@keyframes rospin{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
#rotate-overlay h2{color:var(--acid);font-size:22px;letter-spacing:3px}
#rotate-overlay p{font-size:12.5px;color:rgba(230,240,215,.75);max-width:360px;line-height:1.6;letter-spacing:1px}
/* ============ МОБИЛЬНЫЙ ЛАНДШАФТ (телефон горизонтально) ============ */
@media (max-height:520px){
  .menu-content{padding:0 5vw}
  .menu-tag{font-size:9px;letter-spacing:3px;padding:4px 10px;margin-bottom:10px}
  .game-title{font-size:clamp(30px,10vh,54px)}
  .menu-sub{font-size:10px;letter-spacing:3px;margin-top:6px}
  .menu-buttons{margin-top:12px;gap:7px;width:min(360px,58vw)}
  .btn{padding:9px 16px;font-size:12px;letter-spacing:2px}
  .btn-main{font-size:14px;padding:11px 16px}
  .menu-footer{font-size:8px;letter-spacing:2px;bottom:8px;gap:8px}
  #hud-top{padding:6px 8px;gap:6px}
  .hud-panel{padding:5px 10px}
  #hud-map{font-size:11px}
  #hud-map small{font-size:8px}
  #hud-stats{gap:12px}
  .hstat b{font-size:15px}
  .hstat span{font-size:7.5px}
  body.touch .icon-btn,.icon-btn{width:34px;height:34px;font-size:13px}
  #log{width:210px;top:52px;max-height:32vh}
  .log-line{font-size:9px;padding:4px 7px}

let LANG = 'ru';
function L(k, ...a) {
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N.ru[k] || k;
  a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); });
  return s;
}
function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = L(el.dataset.i18n); });
  $('btn-sound-menu').textContent = L(Sound.muted ? 'm_sound_off' : 'm_sound_on');
  $('btn-auto').textContent = L(G.autoWave ? 't_auto_on' : 't_auto_off');
  refreshHudMode();
  refreshHint();
  buildBriefUI();
  buildToolbar();
  if (G.garageOpen) { buildGarageList(); fillGarageStats(G.garageSel); }
  syncSettingsUI();
}

/* ============================ ЗВУК (WebAudio) ============================ */
const Sound = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  propG: null, jetG: null, windG: null, fireG: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.9;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 2;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.startLoops();
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05);
    $('btn-sound-menu').textContent = L(m ? 'm_sound_off' : 'm_sound_on');
  },
  startLoops() {
    const c = this.ctx;
    this.propG = c.createGain(); this.propG.gain.value = 0;
    const pf = c.createBiquadFilter(); pf.type = 'lowpass'; pf.frequency.value = 700;
    const o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 88;
    const o2 = c.createOscillator(); o2.type = 'square'; o2.frequency.value = 92.5;
    const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 27;
    const lfoG = c.createGain(); lfoG.gain.value = 0.35;
    lfo.connect(lfoG); lfoG.connect(this.propG.gain);
    o1.connect(pf); o2.connect(pf); pf.connect(this.propG); this.propG.connect(this.master);
    o1.start(); o2.start(); lfo.start();
    this.jetG = c.createGain(); this.jetG.gain.value = 0;
    const jn = c.createBufferSource(); jn.buffer = this.noiseBuf; jn.loop = true;
    const jf = c.createBiquadFilter(); jf.type = 'bandpass'; jf.frequency.value = 320; jf.Q.value = 0.8;
    jn.connect(jf); jf.connect(this.jetG); this.jetG.connect(this.master); jn.start();
    this.windG = c.createGain(); this.windG.gain.value = 0.05;
    const wn = c.createBufferSource(); wn.buffer = this.noiseBuf; wn.loop = true;
    const wf = c.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 260;
    wn.connect(wf); wf.connect(this.windG); this.windG.connect(this.master); wn.start();
    this.fireG = c.createGain(); this.fireG.gain.value = 0;
    const fn = c.createBufferSource(); fn.buffer = this.noiseBuf; fn.loop = true;
    const ff = c.createBiquadFilter(); ff.type = 'lowpass'; ff.frequency.value = 150;
    const ff2 = c.createBiquadFilter(); ff2.type = 'highpass'; ff2.frequency.value = 40;
    fn.connect(ff); ff.connect(ff2); ff2.connect(this.fireG); this.fireG.connect(this.master); fn.start();
  },
  loops(p, j, f) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.propG.gain.setTargetAtTime(clamp(p, 0, 0.3), t, 0.25);
    this.jetG.gain.setTargetAtTime(clamp(j, 0, 0.26), t, 0.25);
    this.fireG.gain.setTargetAtTime(clamp(f || 0, 0, 0.4), t, 0.5);
  },
  noise(dur, type, f0, f1, vol) {
    const c = this.ctx; if (!c) return;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(f0, c.currentTime);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), c.currentTime + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(); s.stop(c.currentTime + dur + 0.05);
  },
  tone(f0, f1, dur, type, vol) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), c.currentTime + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(c.currentTime + dur + 0.05);
  },
  click() { this.tone(900, 500, 0.07, 'square', 0.12); },
  lock() { this.tone(1100, 1700, 0.09, 'square', 0.14); },
  place() { this.tone(160, 60, 0.25, 'sine', 0.5); this.noise(0.2, 'lowpass', 500, 120, 0.3); },
  launch() { this.noise(0.9, 'bandpass', 350, 2600, 0.5); this.tone(220, 70, 0.8, 'sawtooth', 0.25); },
  samLaunch() { this.noise(1.2, 'bandpass', 500, 3400, 0.55); this.tone(320, 90, 1.0, 'sawtooth', 0.3); },
  gun() { this.noise(0.12, 'highpass', 1400, 500, 0.4); this.tone(140, 60, 0.1, 'square', 0.3); },
  rifle() {
    this.noise(0.09, 'highpass', 2200, 600, 0.4);
    this.tone(180, 60, 0.08, 'square', 0.25);
    this.noise(0.05, 'bandpass', 3000, 1200, 0.2);
  },
  shout(vol) {
    const c = this.ctx; if (!c) return;
    vol = vol || 0.18;
    const o = c.createOscillator(); o.type = 'sawtooth';
    const g = c.createGain();
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 1.2;
    const t = c.currentTime;
    o.frequency.setValueAtTime(rnd(280, 360), t);
    o.frequency.linearRampToValueAtTime(rnd(480, 560), t + 0.15);
    o.frequency.linearRampToValueAtTime(rnd(240, 300), t + 0.4);
    const vib = c.createOscillator(); vib.type = 'sine'; vib.frequency.value = 18;
    const vg = c.createGain(); vg.gain.value = 25;
    vib.connect(vg); vg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.5); vib.start(t); vib.stop(t + 0.5);
  },
  crackle() {
    for (let i = 0; i < 2; i++)
      G.events.push({ d: rnd(0.15, 0.9), fn: () => this.noise(0.14, 'bandpass', rnd(800, 2400), 300, 0.16) });
  },
  vent() { this.noise(0.5, 'bandpass', 1800, 400, 0.4); this.tone(300, 80, 0.4, 'sawtooth', 0.2); },
  wallfall() {
    this.noise(1.1, 'lowpass', 700, 45, 0.55);
    this.noise(0.5, 'bandpass', 1200, 200, 0.25);
    this.tone(60, 24, 0.9, 'sine', 0.5);
  },
  explode(size) {
    const s = clamp(size, 0.4, 3);
    this.noise(0.9 * s, 'lowpass', 900 * s, 50, 0.75);
    this.tone(90, 26, 0.8 * s, 'sine', 0.8);
    this.noise(0.35, 'highpass', 2500, 800, 0.25 * s);
    if (s > 1.1) this.tone(48, 24, 1.6, 'sine', 0.55 * s);
  },
  crumble() { this.noise(1.4, 'lowpass', 500, 60, 0.5); this.noise(0.8, 'bandpass', 900, 200, 0.3); },
  alarm() {
    const c = this.ctx; if (!c) return;
    [0, 0.55].forEach(off => {
      const o = c.createOscillator(); o.type = 'square';
      const g = c.createGain(); g.gain.value = 0.0001;
      o.frequency.setValueAtTime(520, c.currentTime + off);
      o.frequency.linearRampToValueAtTime(880, c.currentTime + off + 0.25);
      o.frequency.linearRampToValueAtTime(520, c.currentTime + off + 0.5);
      g.gain.setValueAtTime(0.09, c.currentTime + off);
      g.gain.setValueAtTime(0.0001, c.currentTime + off + 0.52);
      o.connect(g); g.connect(this.master);
      o.start(c.currentTime + off); o.stop(c.currentTime + off + 0.6);
    });
  }
};

function radialTexture(inner, outer) {

  const g = x.createRadialGradient(64, 64, 2, 64, 64, 62);
  g.addColorStop(0, inner); g.addColorStop(0.4, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

  g.addColorStop(0.75, 'rgba(255,90,10,0.4)');
  g.addColorStop(1, 'rgba(0,0,0,0)');

function windowTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#2a3038'; x.fillRect(0, 0, 64, 128);
  for (let yy = 4; yy < 124; yy += 8) {
    for (let xx = 4; xx < 60; xx += 8) {
      x.fillStyle = chance(0.45) ? `rgba(255,${rndi(180, 225)},${rndi(110, 150)},${rnd(0.5, 1)})` : '#141a20';
      x.fillRect(xx, yy, 5, 5);
    }
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  return t;
}
function factoryWindowTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#6e6a60'; x.fillRect(0, 0, 128, 64);
  for (let yy = 6; yy < 58; yy += 14) {
    for (let xx = 6; xx < 122; xx += 16) {
      x.fillStyle = chance(0.25) ? 'rgba(40,44,48,0.9)' : `rgba(${rndi(140, 180)},${rndi(170, 200)},${rndi(190, 215)},0.85)`;
      x.fillRect(xx, yy, 12, 9);
      x.strokeStyle = 'rgba(30,30,30,0.6)'; x.lineWidth = 1;
      x.strokeRect(xx, yy, 12, 9);
      x.beginPath(); x.moveTo(xx + 6, yy); x.lineTo(xx + 6, yy + 9); x.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function signTexture(bg, accent) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 128, 32);
  x.fillStyle = accent;
  x.beginPath(); x.arc(16, 16, 11, 0, 7); x.fill();
  x.fillStyle = '#ffffff';
  x.fillRect(34, 9, 52, 6); x.fillRect(34, 19, 38, 6);
  x.fillStyle = accent; x.fillRect(96, 9, 24, 16);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  return t;
}
const TEX_WINDOWS = windowTexture();
const TEX_FWIN = factoryWindowTexture();
const M = (color, rough = 0.75, metal = 0.15) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
function shadowize(obj, cast = true) {
  obj.traverse(o => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = false; } });
}
function makeFlame(scale) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_FIRE, color: 0xffa030, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  s.scale.set(scale, scale * 1.8, 1);
  return s;
}

/* ============================ ЧЕЛОВЕК: КОСТИ (РИГГИНГ) ============================ */
function mergeSkinParts(parts) {
  let vCount = 0;
  parts.forEach(p => { vCount += p.geo.attributes.position.count; });
  const pos = new Float32Array(vCount * 3);
  const nor = new Float32Array(vCount * 3);
  const uv = new Float32Array(vCount * 2);
  const col = new Float32Array(vCount * 3);
  const si = new Uint16Array(vCount * 4);
  const sw = new Float32Array(vCount * 4);
  let o = 0;
  parts.forEach(p => {
    const g = p.geo, P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv;
    for (let i = 0; i < P.count; i++) {
      pos[(o + i) * 3] = P.getX(i);
      pos[(o + i) * 3 + 1] = P.getY(i);
      pos[(o + i) * 3 + 2] = P.getZ(i);
      nor[(o + i) * 3] = N.getX(i);
      nor[(o + i) * 3 + 1] = N.getY(i);
      nor[(o + i) * 3 + 2] = N.getZ(i);
      if (U) {
        uv[(o + i) * 2] = U.getX(i);

function poseHuman(ent, dt, now) {
  const b = ent.bones, st = ent.state;
  if (st === 'aim') {
    ent.phase += dt * 2;
    const dip = ent.reloadAnim || 0;
    b.thL.rotation.x = 0.12;
    b.thR.rotation.x = -0.12;
    b.shL.rotation.x = 0.05;
    b.shR.rotation.x = 0.05;
    b.armR.rotation.x = -1.75 + dip * 0.95 + Math.sin(now * 0.004) * 0.02;
    b.foreR.rotation.x = -0.15 - dip * 0.85;
    b.armL.rotation.x = -1.55 + dip * 0.5;
    b.foreL.rotation.x = -0.55 - dip * 0.4;
    b.armL.rotation.z = 0.35;
    b.spine.rotation.x = -ent.aimPitch * 0.45 + 0.05 + dip * 0.25;
    b.head.rotation.x = -ent.aimPitch * 0.5 + dip * 0.55;
    b.head.rotation.y = Math.sin(now * 0.002 + ent.seed) * 0.1;
    b.hips.position.y = 0.95 - dip * 0.04;
    return;
  }
  if (st === 'look') {
    b.thL.rotation.x = 0.03;
    b.thR.rotation.x = -0.03;
    b.shL.rotation.x = 0;
    b.shR.rotation.x = 0;
    b.armL.rotation.x = -2.3 + Math.sin(now * 0.006 + ent.seed) * 0.12;
    b.armL.rotation.z = -0.5;
    b.foreL.rotation.x = -0.35;
    b.armR.rotation.x = -0.1;
    b.armR.rotation.z = -0.12;
    b.foreR.rotation.x = -0.3;
    b.spine.rotation.x = -0.12;
    b.head.rotation.x = -1.05;
    b.head.rotation.y = Math.sin(now * 0.001 + ent.seed) * 0.3;
    b.hips.position.y = 0.95 + Math.sin(now * 0.003 + ent.seed) * 0.015;
    return;
  }
  const run = st === 'flee';
  const walkLike = st === 'walk' || st === 'patrol';
  const gait = run ? 9.5 : (walkLike ? 5.0 : 1.6);
  ent.phase += dt * gait;
  const ph = ent.phase;
  const swing = run ? 0.95 : (walkLike ? 0.45 : 0.06);
  const bend = run ? 1.35 : (walkLike ? 0.5 : 0.08);
  b.thL.rotation.x = Math.sin(ph) * swing;
  b.thR.rotation.x = Math.sin(ph + Math.PI) * swing;
  b.shL.rotation.x = Math.max(0, Math.sin(ph + 2.4)) * bend;
  b.shR.rotation.x = Math.max(0, Math.sin(ph + 2.4 + Math.PI)) * bend;
  if (run) {
    b.armL.rotation.x = -2.5 + Math.sin(ph * 1.3) * 0.35;
    b.armL.rotation.z = -0.55;
    b.armR.rotation.x = -2.5 + Math.sin(ph * 1.3 + 2) * 0.35;
    b.armR.rotation.z = 0.55;
    b.foreL.rotation.x = -0.7;
    b.foreR.rotation.x = -0.7;
    b.spine.rotation.x = 0.30;
    b.head.rotation.x = -0.15;
    b.head.rotation.y = Math.sin(ph * 0.35) * 0.7;
  } else if (walkLike) {
    b.armL.rotation.x = Math.sin(ph + Math.PI) * 0.4;
    b.armR.rotation.x = Math.sin(ph) * 0.4;
    b.armL.rotation.z = 0.08;
    b.armR.rotation.z = -0.08;
    b.foreL.rotation.x = -0.25;
    b.foreR.rotation.x = -0.25;
    b.spine.rotation.x = 0.05;
    b.head.rotation.y = Math.sin(ph * 0.2) * 0.4;
    b.head.rotation.x = 0;
  } else {
    b.armL.rotation.x = -0.08 + Math.sin(now * 0.0016 + ent.seed) * 0.05;
    b.armR.rotation.x = -0.08 + Math.sin(now * 0.0016 + ent.seed + 1) * 0.05;
    b.armL.rotation.z = 0.1;
    b.armR.rotation.z = -0.1;
    b.foreL.rotation.x = -0.15;
    b.foreR.rotation.x = -0.15;
    b.spine.rotation.x = 0.02 + Math.sin(now * 0.0012 + ent.seed) * 0.02;
    b.head.rotation.y = Math.sin(now * 0.0007 + ent.seed) * 0.5;
    b.head.rotation.x = 0;
  }
  b.hips.position.y = 0.95 + Math.abs(Math.sin(ph)) * (run ? 0.06 : 0.025);
}
function moveHuman(ent, dt, speed) {
  const dx = ent.target.x - ent.mesh.position.x;
  const dz = ent.target.z - ent.mesh.position.z;
  const d = Math.hypot(dx, dz);
  if (d < 1.2) return true;
  const yaw = Math.atan2(dx, dz);
  ent.mesh.rotation.y = lerpAngle(ent.mesh.rotation.y, yaw, clamp(6 * dt, 0, 1));
  ent.mesh.position.x += dx / d * speed * dt;
  ent.mesh.position.z += dz / d * speed * dt;
  return false;
}

  if (tall) {
    const a = rnd(0, Math.PI * 2);
    s.falling = { axis: new THREE.Vector3(Math.cos(a), 0, Math.sin(a)), angle: 0, speed: rnd(0.45, 0.75) * DM(), box };
    Sound.crumble();
    spawnSparks(center, 8, 8, true);
  } else {
    s.group.visible = false;
    spawnChunks(s, box, false);
    explode(center.clone().setY(Math.max(2, sizeV.y * 0.5)), 1.6, { damage: false });
    Sound.crumble();
    const k = rndi(1, 3);
    for (let i = 0; i < k; i++) {
      schedule(0.25 + i * 0.38, () => {
        explode(new THREE.Vector3(
          center.x + rnd(-sizeV.x / 2, sizeV.x / 2),
          rnd(1, Math.max(2, sizeV.y * 0.7)),
          center.z + rnd(-sizeV.z / 2, sizeV.z / 2)), rnd(0.6, 1.1), { damage: true });
      });
    }
  }
  G.emitters.push({ pos: new THREE.Vector3(center.x, 1.2, center.z), type: 'fire', rate: 4, acc: 0, life: 14, t: 0 });
  G.emitters.push({ pos: new THREE.Vector3(center.x, 2.5, center.z), type: 'smoke', rate: 4, acc: 0, life: 22, t: 0, color: 0x161616 });
}
function damageStruct(s, dmg, point, chainLevel) {
  if (!s.alive) return;
  s.hp -= dmg;
  if (s.hp <= 0) {
    if (BARREL_RE.test(s.name)) s.chainLevel = (chainLevel || 0) + 1;
    destroyStruct(s, point);
    return;
  }
  if (s.isPart && dmg > 8) {
    s.group.traverse(o => { if (o.isMesh && o.material && o.material.color) o.material.color.multiplyScalar(0.82); });
  }
  if (dmg > 12) {
    const top = s.burnPoint.clone();
    for (let i = 0; i < rndi(1, 2); i++) {
      spawnDebrisChunk(
        top.clone().add(new THREE.Vector3(rnd(-2, 2), rnd(-1, 1), rnd(-2, 2))),
        new THREE.Vector3(rnd(-4, 4), rnd(1, 4), rnd(-4, 4)),
        rnd(0.4, 1.2),
        new THREE.Color(s.palette).multiplyScalar(0.6).getHex(),
        chance(0.4) ? 1.5 : 0);
    }
    spawnSmoke(top, { size: rnd(2, 3.5), life: 2, color: 0x3a3a3a, grow: 3 });
    spawnSparks(top, 4, 6, true);
  }
  if (!s.burning && s.hp < s.maxHp * 0.65) {
    s.burning = true;
    createPoolFire(s.burnPoint.clone().setY(Math.max(1, s.height * 0.7)), rnd(1.0, 1.6), rnd(20, 35));
    G.emitters.push({ pos: s.burnPoint.clone().add(new THREE.Vector3(0, 2, 0)), type: 'smoke', rate: 4, acc: 0, life: 999, t: 0, color: 0x101010, structId: s.id });
    log(L('lg_burning', s.name), 'warn');
  }
}

function addSprite(tex, color, pos, size, blending) {
  const m = new THREE.SpriteMaterial({ map: tex, color, transparent: true, blending, depthWrite: false });
  const s = new THREE.Sprite(m);
  s.position.copy(pos);
  s.scale.set(size, size, 1);
  scene.add(s);
  return s;
}
function spawnSmoke(pos, opt = {}) {
  if (G.smokes.length > CAP_SMOKE) return;
  const s = addSprite(TEX_SMOKE, opt.color || 0x2a2a2a, pos, opt.size || rnd(2, 4), THREE.NormalBlending);
  const life = opt.life || rnd(2.2, 3.6);
  G.smokes.push({
    spr: s,
    vel: opt.vel ? opt.vel.clone() : new THREE.Vector3(rnd(-1, 1), rnd(2, 4.5), rnd(-1, 1)),
    life, max: life, grow: opt.grow || rnd(2, 4), drag: 0.94, op: opt.op || 0.5
  });

}
function spawnFire(pos, size) {
  if (G.fires.length > CAP_FIRE) return;
  const s = addSprite(TEX_FIRE, 0xffa040, pos, size || rnd(2, 4), THREE.AdditiveBlending);
  G.fires.push({ spr: s, vel: new THREE.Vector3(rnd(-1, 1), rnd(1, 3), rnd(-1, 1)), life: rnd(0.3, 0.55), max: 0.55, grow: -2 });
}
function spawnSparks(pos, n, speed, ember) {

    G.sparks.push({ spr: s, vel: v, life: ember ? rnd(1, 2.4) : rnd(0.4, 1.1), max: ember ? 2.4 : 1.1, grav: ember ? 12 : 18, bounce: !!ember });

}

function spawnBall(pos, size) {

function spawnDebrisChunk(pos, vel, size, color, burn) {

function spawnDebris(pos, n, speed, color) {

function spawnCrater(pos, r) {

/* ============================ ПОЖАРЫ v2 (ОЧАГИ) ============================ */
function poolFireLightCount() {
  let n = 0;
  G.poolFires.forEach(p => { if (p.light) n++; });
  return n;
}
function createPoolFire(pos, size, life) {
  if (G.poolFires.length >= CAP_POOLFIRE) {
    const old = G.poolFires.shift();
    disposePoolFire(old);
  }
  const flames = [];
  const n = clamp(2 + Math.floor(size), 2, 4);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rnd(-0.4, 0.4);
    const rr = size * rnd(0.3, 0.6);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_FLAME, color: 0xff7020, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.position.set(pos.x + Math.cos(a) * rr, pos.y + size * 0.6, pos.z + Math.sin(a) * rr);
    s.scale.set(size * 1.1, size * 1.9, 1);
    scene.add(s);
    flames.push({ spr: s, ph: rnd(0, 9), ox: Math.cos(a) * rr, oz: Math.sin(a) * rr, kind: 'outer' });
  }
  for (let i = 0; i < Math.max(1, n - 1); i++) {
    const a = rnd(0, 6.28);
    const rr = size * rnd(0.05, 0.25);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_FLAME, color: 0xffe0a0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.position.set(pos.x + Math.cos(a) * rr, pos.y + size * 0.45, pos.z + Math.sin(a) * rr);
    s.scale.set(size * 0.7, size * 1.3, 1);
    scene.add(s);
    flames.push({ spr: s, ph: rnd(0, 9), ox: Math.cos(a) * rr, oz: Math.sin(a) * rr, kind: 'core' });
  }
  for (let i = 0; i < 2; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_FLAME, color: 0xffa040, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(size * 0.5, size * 0.9, 1);
    scene.add(s);
    flames.push({ spr: s, ph: rnd(0, 9), ox: 0, oz: 0, kind: 'lick' });
  }
  let light = null;
  if (poolFireLightCount() < 3) {
    light = new THREE.PointLight(0xff7020, size * 3, size * 30, 2);
    light.position.set(pos.x, pos.y + size * 1.5, pos.z);
    scene.add(light);
  }
  const glow = new THREE.Mesh(new THREE.CircleGeometry(size * 3.2, 20),
    new THREE.MeshBasicMaterial({ color: 0xff5a10, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3 }));
  glow.rotation.x = -Math.PI / 2;
  glow.position.set(pos.x, pos.y + 0.12, pos.z);
  scene.add(glow);
  spawnCrater(pos, size * 2.4);
  G.poolFires.push({
    pos: pos.clone(), size, life, max: life, t: 0, flames, light, glow,
    smokeAcc: 0, emberAcc: 0, crackAcc: 0, flare: 0, flareT: rnd(1, 4), swirl: rnd(0, 9), spreadDone: false
  });
  Sound.crackle();
}
function disposePoolFire(pf) {
  pf.flames.forEach(f => { scene.remove(f.spr); f.spr.material.dispose(); });
  if (pf.light) scene.remove(pf.light);
  if (pf.glow) { scene.remove(pf.glow); pf.glow.geometry.dispose(); pf.glow.material.dispose(); }
}
function updatePoolFires(dt, now) {
  for (let i = G.poolFires.length - 1; i >= 0; i--) {
    const pf = G.poolFires[i];
    pf.t += dt; pf.life -= dt;
    if (pf.life <= 0) { disposePoolFire(pf); G.poolFires.splice(i, 1); continue; }
    const env = clamp(Math.min(pf.t * 1.5, pf.life / 2.5), 0, 1);
    const ns = now * 0.001;
    pf.flareT -= dt;
    if (pf.flareT <= 0) {
      pf.flareT = rnd(1.5, 4.5);
      pf.flare = 0.45;
      for (let k = 0; k < 3; k++) {
        spawnFire(pf.pos.clone().add(new THREE.Vector3(rnd(-1, 1) * pf.size * 0.4, pf.size * rnd(0.8, 1.6), rnd(-1, 1) * pf.size * 0.4)), rnd(1.5, 3));
      }
      spawnSmoke(pf.pos.clone().add(new THREE.Vector3(0, pf.size * 1.5, 0)),
        { color: 0x0a0a0a, size: pf.size * 1.4, life: 3, grow: 5, op: 0.75, vel: new THREE.Vector3(0, 7, 0) });
    }
    pf.flare = Math.max(0, pf.flare - dt);
    const boost = 1 + pf.flare * 1.2;
    pf.flames.forEach(f => {
      const flick = 0.78 + 0.26 * Math.sin(ns * 13 + f.ph) + 0.14 * Math.sin(ns * 31 + f.ph * 2.7);
      let s;
      if (f.kind === 'lick') {
        const cyc = (ns * 0.9 + f.ph) % 1;
        s = pf.size * 0.5 * (1 - cyc * 0.6) * flick * boost;
        f.spr.position.set(
          pf.pos.x + Math.sin(ns * 3 + f.ph) * pf.size * 0.4,
          pf.pos.y + pf.size * (0.6 + cyc * 2.2),
          pf.pos.z + Math.cos(ns * 2.6 + f.ph) * pf.size * 0.4);
        f.spr.material.opacity = 0.7 * env * (1 - cyc);
      } else {
        s = pf.size * flick * boost * (f.kind === 'core' ? 0.75 : 1.1);
        f.spr.position.set(
          pf.pos.x + f.ox + Math.sin(ns * 5 + f.ph) * 0.3,
          pf.pos.y + s * (f.kind === 'core' ? 0.55 : 0.75),
          pf.pos.z + f.oz + Math.cos(ns * 4.4 + f.ph) * 0.3);
        f.spr.material.opacity = 0.85 * env * (0.75 + 0.25 * Math.sin(ns * 17 + f.ph * 1.3));
      }
      f.spr.scale.set(s * 0.85, s * 1.7, 1);
      f.spr.material.rotation = Math.sin(ns * 2.4 + f.ph) * 0.2;
    });
    if (pf.light) pf.light.intensity = env * pf.size * (3 + Math.sin(ns * 11) * 1.1 + Math.random() * 0.9) * boost;
    if (pf.glow) pf.glow.material.opacity = env * (0.22 + 0.1 * Math.sin(ns * 9 + pf.swirl) + Math.random() * 0.06) * boost;
    pf.smokeAcc += pf.size * 1.3 * dt * boost;
    while (pf.smokeAcc > 1) {
      pf.smokeAcc -= 1;
      spawnSmoke(pf.pos.clone().add(new THREE.Vector3(rnd(-1, 1) * pf.size * 0.5, pf.size * 1.3, rnd(-1, 1) * pf.size * 0.5)),
        {
          color: 0x0a0a0a, size: rnd(2, 3.4) * (0.6 + pf.size * 0.25), life: rnd(4, 7), grow: 5.2, op: 0.78,
          vel: new THREE.Vector3(Math.sin(pf.t * 1.3 + pf.swirl) * 1.2, rnd(5.5, 8.5), Math.cos(pf.t * 1.1 + pf.swirl) * 1.2)
        });
    }
    pf.emberAcc += pf.size * 0.5 * dt;
    while (pf.emberAcc > 1) {
      pf.emberAcc -= 1;
      if (G.sparks.length > CAP_SPARK * 0.7) break;
      const s = addSprite(TEX_SPARK, 0xff9040,
        pf.pos.clone().add(new THREE.Vector3(rnd(-1, 1) * pf.size * 0.4, pf.size * 0.8, rnd(-1, 1) * pf.size * 0.4)),
        rnd(0.3, 0.7), THREE.AdditiveBlending);
      G.sparks.push({ spr: s, vel: new THREE.Vector3(rnd(-1.5, 1.5), rnd(4, 10), rnd(-1.5, 1.5)), life: rnd(1.2, 2.8), max: 2.8, grav: 2.4, bounce: false });
    }
    pf.crackAcc += dt;
    if (pf.crackAcc > 1.4) {
      pf.crackAcc = 0;
      if (chance(0.6) && pf.pos.distanceTo(camTarget) < 170) Sound.noise(0.09, 'bandpass', rnd(500, 1800), 250, 0.06);
    }
    if (!pf.spreadDone && pf.t > 9 && pf.life > 8 && chance(dt * 0.05) && G.poolFires.length < CAP_POOLFIRE) {
      pf.spreadDone = true;
      const off = pf.pos.clone().add(new THREE.Vector3(rnd(-6, 6), 0, rnd(-6, 6)));
      createPoolFire(off.setY(0.4), pf.size * rnd(0.5, 0.7), pf.life * rnd(0.5, 0.7));
      log(L('lg_fire_spread'), 'bad');
    }
  }
}

/* ============================ ПАНИКА ГОРОЖАН ============================ */
function panicCivilians(pos, rad, force) {
  G.civilians.forEach(c => {
    const d = c.mesh.position.distanceTo(pos);
    if (force || d < rad) {
      c.state = 'flee';
      c.timer = rnd(6, 10);
      const dir = c.mesh.position.clone().sub(pos);
      dir.y = 0;
      if (dir.lengthSq() < 1) dir.set(rnd(-1, 1), 0, rnd(-1, 1));
      dir.normalize();
      c.target = c.mesh.position.clone().add(dir.multiplyScalar(rnd(45, 75)));
      c.target.x = clamp(c.target.x, -150, 150);
      c.target.z = clamp(c.target.z, -150, 150);
      if (chance(0.5)) Sound.shout(0.12);
    }
  });
}

/* ============================ ВЗРЫВ ============================ */
function explode(pos, size, opt = {}) {
  size = size || 1;
  const q = FXQ();
  spawnFlashLight(pos, size);
  spawnBall(pos, size);
  const nFire = Math.round((2 + size * 0.6) * q);
  for (let i = 0; i < nFire; i++) {
    spawnFire(pos.clone().add(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(size)), size * rnd(2, 3.4));
  }
  const nSmoke = Math.round((4 * size + 3) * q);
  for (let i = 0; i < nSmoke; i++) {
    spawnSmoke(pos.clone().add(new THREE.Vector3(rnd(-2, 2), rnd(-1, 2), rnd(-2, 2)).multiplyScalar(size * 0.6)),
      { size: rnd(2, 4) * size * 0.7, grow: rnd(3, 6), life: rnd(2.5, 4.5), color: chance(0.7) ? 0x1c1c1c : 0x3a3a3a });
  }
  spawnSparks(pos, Math.round((8 * size + 4) * q), 17 * size, true);
  spawnRing(pos, size, pos.y > 6);
  if (pos.y < 4) {
    spawnCrater(pos, 2.2 * size + rnd(0, 2));
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      spawnSmoke(pos.clone().add(new THREE.Vector3(Math.cos(a) * 2, 0.6, Math.sin(a) * 2)),
        { size: rnd(2, 3.5), life: rnd(1.6, 2.6), grow: 5, color: 0x8a7a5f, vel: new THREE.Vector3(Math.cos(a) * 9, 1.5, Math.sin(a) * 9) });
    }
    if (size >= 1.6) schedule(0.4, () => createPoolFire(pos.clone().setY(0.4), rnd(0.8, 1.3) * size * 0.5, rnd(5, 9)));
  }
  spawnDebris(pos, Math.round(2 * size * q), 9 * size, opt.debrisColor);
  shake = Math.min(1.8, shake + 0.24 * size);
  if (size >= 1.7) screenFlash(0.34);
  Sound.explode(size);
  if (size > 1.1) Sound.crackle();
  panicCivilians(pos, 55, false);
  if (opt.damage !== false) {
    const R = 8 * size + 4;
    const lvl = opt.chainLevel || 0;
    G.structures.forEach(s => {
      if (!s.alive) return;
      const d = s.group.position.distanceTo(pos);
      if (d < R + s.radius) damageStruct(s, (115 * size) * (1 - clamp(d / (R + s.radius), 0, 1)) + 28, pos, lvl);
    });
  }
}

/* --- НПЗ --- */
function layoutNPZ() {
  let n = 0;
  const tank = (x, z, r, h) => {
    const g = tankMesh(r, h, chance(0.78) ? 0xe8e8e4 : 0xd4d4d0);
    g.position.set(x, 0, z);

function disposeDeep(o) {
  if (!o) return;
  o.traverse(k => {
    if (k.geometry) k.geometry.dispose();
    if (k.material) (Array.isArray(k.material) ? k.material : [k.material]).forEach(m => m.dispose());
  });
}
function clearWorld() {
  if (!scene) return;
  const all = [
    ...G.structures.map(s => s.group),
    ...G.flyers.map(f => f.group),
    ...G.pvoUnits.map(p => p.group),
    ...G.interceptors.map(i => i.group),
    ...G.tracers.map(t => t.mesh),
    ...G.debris.map(d => d.mesh),
    ...G.smokes.map(p => p.spr),
    ...G.fires.map(p => p.spr),
    ...G.sparks.map(p => p.spr),
    ...G.rings.map(r => r.mesh),
    ...G.balls.map(b => b.mesh),
    ...G.flashes.map(f => f.light),
    ...G.civilians.map(c => c.mesh),
    ...G.soldiers.map(s => s.mesh),
    ...G.craters,
    ...G.ruins
  ];
  all.forEach(o => { if (o) { scene.remove(o); disposeDeep(o); } });
  G.poolFires.forEach(disposePoolFire);
  G.structures.forEach(s => {
    if (s.fallPart && s.fallPart.pivot) { scene.remove(s.fallPart.pivot); disposeDeep(s.fallPart.pivot); }
  });
  ['ghost', 'reticle', 'marker'].forEach(k => {
    if (G[k]) { scene.remove(G[k]); disposeDeep(G[k]); G[k] = null; }
  });
  if (groundMesh) { scene.remove(groundMesh); disposeDeep(groundMesh); groundMesh = null; }
  if (skyMesh) { scene.remove(skyMesh); disposeDeep(skyMesh); skyMesh = null; }
  while (scene.children.length) scene.remove(scene.children[0]);
  G.structures = []; G.structById = {}; G.structGroups = [];
  G.flyers = []; G.pvoUnits = []; G.interceptors = []; G.tracers = [];
  G.debris = []; G.bursts = []; G.smokes = []; G.fires = []; G.sparks = []; G.rings = [];
  G.balls = []; G.flashes = []; G.emitters = []; G.craters = []; G.ruins = [];
  G.poolFires = []; G.events = []; G.civilians = []; G.soldiers = [];
  G.activeBarrels = 0;
  G.hoverStruct = null;
}

function launchAttack(unitId, point, structId) {
  const u = UNITS[unitId];
  const builders = { fpv: buildFPV, flamingo: buildFlamingo, harpoon: buildHarpoon, shahed: buildShahed, kalibr: buildKalibr, storm: buildStorm };
  const model = builders[unitId]();
  const dir = point.clone().setY(0);
  if (dir.length() < 5) dir.set(rnd(-1, 1), 0, rnd(-1, 1));
  dir.normalize();
  const perp = new THREE.Vector3(-dir.z, 0, dir.x);
  const spawn = dir.clone().multiplyScalar(-SPAWN_D).add(perp.multiplyScalar(rnd(-60, 60)));
  spawn.y = u.alt + rnd(-3, 6);
  model.group.position.copy(spawn);
  scene.add(model.group);
  const target = point.clone();
  if (structId) {
    const s = G.structById[structId];
    if (s) target.set(s.group.position.x, s.height * 0.55, s.group.position.z);
  } else {
    target.y = u.alt * 0.4 + rnd(0, 3);
  }
  const vel = target.clone().sub(spawn).normalize().multiplyScalar(u.speed);
  G.flyers.push({
    group: model.group, spin: model.spin, flame: model.flame, type: unitId, vel,
    hp: u.hp, speed: u.speed, power: u.power, target, targetStructId: structId || null,
    trailAcc: 0, alive: true, wob: rnd(0, 10), name: uname(unitId)
  });
  G.stats.launched++;
  updateStats();
  Sound.launch();
  log(structId
    ? L('lg_launch', uname(unitId), G.structById[structId].name)
    : L('lg_launch_pt', uname(unitId), Math.round(point.x), Math.round(point.z)), 'warn');
}

  });
  for (let i = 0; i < 4; i++) {
    spawnSmoke(new THREE.Vector3(point.x + rnd(-2, 2), 0.5, point.z + rnd(-2, 2)),
      { size: rnd(1.5, 2.5), life: 1.2, color: 0x8a7a5a, grow: 2 });
  }
  Sound.place();
  log(L('lg_placed', pname(typeId), Math.round(point.x), Math.round(point.z)), 'good');
}
function killFlyer(f, byPvo, ownerName) {
  if (!f.alive) return;
  f.alive = false;
  explode(f.group.position.clone(), 0.9, { damage: false });
  spawnDebris(f.group.position.clone(), rndi(2, 4), 9, 0x33332e);
  if (byPvo) {
    G.stats.killed++;
    log(L('lg_intercept', f.name, ownerName), 'good');
  }
  updateStats();
}
function fireSAM(p, f) {
  G.stats.shots++;
  updateStats();
  p.tubeG.updateWorldMatrix(true, true);
  const muzzle = new THREE.Vector3(rnd(-0.5, 0.5), 5.6, rnd(-0.5, 0.5));
  p.tubeG.localToWorld(muzzle);
  const dir = new THREE.Vector3(0, 1, 0).applyQuaternion(p.tubeG.getWorldQuaternion(tmpQ)).normalize();
  dir.x += rnd(-0.08, 0.08);
  dir.z += rnd(-0.08, 0.08);
  dir.normalize();
  const model = buildInterceptor();
  model.group.position.copy(muzzle);
  scene.add(model.group);
  G.interceptors.push({
    group: model.group, flame: model.flame, vel: dir.multiplyScalar(28),
    speed: 28, maxSpeed: 88, target: f, life: 0, hit: p.hit, owner: p.name, trailAcc: 0
  });
  spawnFire(muzzle, 3.5);
  spawnBall(muzzle, 0.8);
  for (let i = 0; i < 4; i++) {
    spawnSmoke(muzzle.clone().add(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1))),
      { size: rnd(1.5, 3), life: 1.8, color: 0x9a9a9a });
  }
  Sound.samLaunch();
  shake = Math.min(1.8, shake + 0.12);
  log(L('lg_sam', p.name, f.name), 'warn');
}
function fireGuns(p, f) {
  G.stats.shots++;
  updateStats();
  G.bursts.push({ owner: p, target: f, shots: 5, t: 0, interval: 0.07, hitDecided: chance(p.hit), idx: 0 });
}

/* ============================ ГОРОЖАНЕ / СОЛДАТЫ ============================ */
function updateCivilians(dt, now) {
  G.civilians.forEach(c => {
    if (c.state === 'flee') {
      c.timer -= dt;
      const arrived = moveHuman(c, dt, 4.6);
      if (chance(dt * 0.25)) Sound.shout(0.07);
      if (arrived || c.timer <= 0) {
        c.state = chance(0.5) ? 'idle' : 'walk';
        c.timer = rnd(2, 5);
        c.target = c.mesh.position.clone().add(new THREE.Vector3(rnd(-25, 25), 0, rnd(-25, 25)));
      }
    } else if (c.state === 'look') {
      c.timer -= dt;
      if (c.timer <= 0) c.state = 'walk';
    } else if (c.state === 'walk') {
      const arrived = moveHuman(c, dt, 1.25);
      if (arrived) {
        c.state = 'idle';
        c.timer = rnd(2, 6);
      } else {
        let near = false;
        for (let i = 0; i < G.flyers.length; i++) {
          const f = G.flyers[i];
          if (f.alive && f.group.position.y < 45 && f.group.position.distanceTo(c.mesh.position) < 45) { near = true; break; }
        }
        if (near && chance(dt * 0.5)) { c.state = 'look'; c.timer = rnd(1.5, 3.5); }
      }
    } else {
      c.timer -= dt;
      if (c.timer <= 0) {
        c.state = 'walk';
        c.target = c.mesh.position.clone().add(new THREE.Vector3(rnd(-30, 30), 0, rnd(-30, 30)));
        c.target.x = clamp(c.target.x, -150, 150);
        c.target.z = clamp(c.target.z, -150, 150);
      }
    }
    poseHuman(c, dt, now);
  });
}
function updateSoldiers(dt, now) {
  G.soldiers.forEach(s => {
    s.cooldown -= dt;
    s.alertCd -= dt;
    s.burstT -= dt;
    s.reloadAnim = Math.max(0, (s.reloadAnim || 0) - dt * 1.1);
    let best = null, bestD = 1e9;
    G.flyers.forEach(f => {
      if (!f.alive) return;
      const d = f.group.position.distanceTo(s.mesh.position);
      if (d < PVOS.soldier.range && f.group.position.y < 120 && d < bestD) { bestD = d; best = f; }
    });
    if (best) {
      s.lastAim = best.group.position.clone();
      if (s.state !== 'aim') {
        s.state = 'aim';
        s.engage = best;
        s.burstLeft = 0;
        if (s.alertCd <= 0) {
          s.alertCd = 9;
          log(L('lg_alert'), 'bad');
          Sound.shout(0.3);
          Sound.alarm();
          panicCivilians(s.mesh.position, 1e9, true);
        }
      }
      const tp = best.group.position;
      const dx = tp.x - s.mesh.position.x;
      const dz = tp.z - s.mesh.position.z;
      const dy = tp.y - 1.5;
      const yaw = Math.atan2(dx, dz);
      s.mesh.rotation.y = lerpAngle(s.mesh.rotation.y, yaw, clamp(5 * dt, 0, 1));
      s.aimPitch = clamp(Math.atan2(dy, Math.max(4, Math.hypot(dx, dz))), 0, 1.2);
      if (s.cooldown <= 0 && s.burstLeft <= 0) {
        s.burstLeft = 5;
        s.burstT = 0;
        s.cooldown = PVOS.soldier.reload + rnd(0, 0.5);
        G.stats.shots++;
        updateStats();
        s.willHit = chance(PVOS.soldier.hit);
      }
    } else if (s.state === 'aim' && s.burstLeft <= 0) {
      s.state = 'patrol';
      s.engage = null;
      s.target = s.home.clone().add(new THREE.Vector3(rnd(-18, 18), 0, rnd(-18, 18)));
    }
    if (s.state === 'aim' && s.burstLeft > 0 && s.burstT <= 0) {
      s.burstT = 0.085;
      s.burstLeft--;
      s.rifle.group.updateWorldMatrix(true, true);
      const muzzle = new THREE.Vector3();
      s.rifle.tip.getWorldPosition(muzzle);
      const aim = (best ? best.group.position : s.lastAim || s.mesh.position.clone().add(new THREE.Vector3(0, 20, -40))).clone();
      const converge = best && s.willHit && s.burstLeft <= 2;
      if (!converge) aim.add(new THREE.Vector3(rnd(-6, 6), rnd(-3.5, 3.5), rnd(-6, 6)));
      spawnTracer(muzzle, aim);
      spawnFire(muzzle, 0.9);
      const flashSpr = addSprite(TEX_FIRE, 0xffe090, muzzle, 1.1, THREE.AdditiveBlending);
      G.fires.push({ spr: flashSpr, vel: new THREE.Vector3(0, 0, 0), life: 0.08, max: 0.08, grow: -2 });
      const side = new THREE.Vector3(Math.cos(s.mesh.rotation.y), 0, -Math.sin(s.mesh.rotation.y));
      spawnDebrisChunk(muzzle.clone(), side.multiplyScalar(rnd(1.5, 2.5)).add(new THREE.Vector3(0, rnd(1, 2), 0)), 0.06, 0xd8b040, 0);
      Sound.rifle();
      shake = Math.min(1.8, shake + 0.015);
      if (converge) {
        best.hp -= 8;
        spawnSparks(best.group.position.clone(), 5, 7, true);
        if (best.hp <= 0) {
          killFlyer(best, true, pname('soldier'));
          G.stats.hits++;
          updateStats();
          log(L('lg_soldier_down', best.name), 'good');
        }
      }
      if (s.burstLeft === 0) s.reloadAnim = 1;
    }
    if (s.state === 'patrol') {
      const arrived = moveHuman(s, dt, 1.6);
      if (arrived) {
        s.timer += dt;
        if (s.timer > 1.5) {
          s.timer = 0;
          s.target = s.home.clone().add(new THREE.Vector3(rnd(-18, 18), 0, rnd(-18, 18)));
        }
      } else s.timer = 0;
    }
    poseHuman(s, dt, now);
  });
}

/* ============================ ОБНОВЛЕНИЕ СУЩНОСТЕЙ ============================ */
function updateEvents(dt) {
  for (let i = G.events.length - 1; i >= 0; i--) {
    const e = G.events[i];
    e.d -= dt;
    if (e.d <= 0) { G.events.splice(i, 1); e.fn(); }
  }
}
function updateFlyers(dt) {
  for (let i = G.flyers.length - 1; i >= 0; i--) {
    const f = G.flyers[i];
    if (!f.alive) { scene.remove(f.group); G.flyers.splice(i, 1); continue; }
    f.wob += dt;
    if (f.targetStructId) {
      const s = G.structById[f.targetStructId];
      if (s && s.alive) f.target.set(s.group.position.x, s.height * 0.55, s.group.position.z);
    }
    tmpV.copy(f.target).sub(f.group.position);
    const dist = tmpV.length();
    tmpV.normalize();
    tmpV.x += Math.sin(f.wob * 2.2) * 0.06;
    tmpV.y += Math.sin(f.wob * 1.7) * 0.05;
    tmpV.normalize().multiplyScalar(f.speed);
    f.vel.lerp(tmpV, clamp(2.2 * dt, 0, 1));
    f.group.position.addScaledVector(f.vel, dt);
    if (f.group.position.y < 1.2) f.group.position.y = 1.2;
    tmpV2.copy(f.group.position).add(f.vel);
    f.group.lookAt(tmpV2);
    f.group.rotateZ(clamp(-f.vel.x * 0.01, -0.5, 0.5));
    f.spin.forEach(sp => { sp.rotation.y += dt * 55; sp.rotation.z += dt * 40; });
    if (f.flame) {
      const k = 1 + Math.sin(f.wob * 40) * 0.25;
      f.flame.scale.set(f.flame.scale.x, f.flame.scale.x * 1.8 * k, 1);
    }
    f.trailAcc += dt;
    const tu = UNITS[f.type].trail / Math.max(0.5, FXQ());
    while (f.trailAcc > tu) {
      f.trailAcc -= tu;
      spawnSmoke(f.group.position.clone().add(new THREE.Vector3(rnd(-0.3, 0.3), rnd(-0.3, 0.3), rnd(-0.3, 0.3))),
        {
          size: (f.type === 'fpv') ? rnd(0.5, 1) : rnd(1, 1.9),
          life: rnd(1.2, 2.2),
          grow: (f.type === 'fpv') ? 1.5 : 2.6,
          color: (f.type === 'fpv') ? 0x555555 : 0x777777,
          vel: new THREE.Vector3(0, 0.6, 0)
        });
    }
    if (dist < 6) {
      f.alive = false;
      const ts = f.targetStructId ? G.structById[f.targetStructId] : null;
      explode(f.group.position.clone(), f.power, {});
      if (ts) log(L('lg_hit', f.name, ts.name), 'bad');
      else log(L('lg_impact', f.name), 'bad');
      scene.remove(f.group);
      G.flyers.splice(i, 1);
      continue;
    }
    if (f.hp <= 0) { killFlyer(f, true, 'ПВО'); scene.remove(f.group); G.flyers.splice(i, 1); }
  }
}
function updatePvo(dt) {
  G.pvoUnits.forEach(p => {
    p.radar.rotation.y += dt * 2.4;
    p.cooldown -= dt;
    let best = null, bestD = 1e9;
    G.flyers.forEach(f => {
      if (!f.alive) return;
      const d = f.group.position.distanceTo(p.group.position);
      if (d < p.range && f.group.position.y > 1 && d < bestD) { bestD = d; best = f; }
    });
    p.target = best;
    if (best) {
      const dx = best.group.position.x - p.group.position.x;
      const dz = best.group.position.z - p.group.position.z;
      const dy = best.group.position.y - 1.5;
      const yaw = Math.atan2(dx, dz);
      p.turret.rotation.y = lerpAngle(p.turret.rotation.y, yaw, clamp(4 * dt, 0, 1));
      if (p.gunG) {
        const horiz = Math.max(4, Math.hypot(dx, dz));
        const pitch = clamp(Math.atan2(dy, horiz), -0.15, 1.25);
        p.gunG.rotation.x = lerp(p.gunG.rotation.x, -pitch, clamp(6 * dt, 0, 1));
      }
      p.lockT += dt;
      if (p.lockT >= p.lock && p.cooldown <= 0) {
        p.cooldown = p.reload;
        p.lockT = 0;
        if (p.kind === 'sam') fireSAM(p, best);
        else fireGuns(p, best);
      }
    } else p.lockT = 0;
  });
}
function updateInterceptors(dt) {
  for (let i = G.interceptors.length - 1; i >= 0; i--) {
    const it = G.interceptors[i];
    it.life += dt;
    if (!it.target.alive || it.life > 10) {
      explode(it.group.position.clone(), 0.5, { damage: false });
      log(L('lg_self'), 'warn');
      scene.remove(it.group);
      G.interceptors.splice(i, 1);
      continue;
    }
    it.speed = Math.min(it.maxSpeed, it.speed + 45 * dt);
    tmpV.copy(it.target.group.position).addScaledVector(it.target.vel, 0.25).sub(it.group.position);
    const dist = tmpV.length();
    tmpV.normalize().multiplyScalar(it.speed);
    it.vel.lerp(tmpV, clamp(3.5 * dt, 0, 1)).normalize().multiplyScalar(it.speed);
    it.group.position.addScaledVector(it.vel, dt);
    tmpV2.copy(it.group.position).add(it.vel);
    it.group.lookAt(tmpV2);
    if (it.flame) it.flame.scale.set(1.2, 2.4 * (1 + Math.sin(it.life * 50) * 0.2), 1);
    it.trailAcc += dt;
    while (it.trailAcc > 0.05) {
      it.trailAcc -= 0.05;
      spawnSmoke(it.group.position.clone(),
        { size: rnd(0.7, 1.3), life: rnd(1, 1.8), grow: 2.2, color: 0x8a8a8a, vel: new THREE.Vector3(0, 0.8, 0) });
    }
    if (dist < 7) {
      if (chance(it.hit)) {
        G.stats.hits++;
        explode(it.group.position.clone().add(it.target.group.position).multiplyScalar(0.5), 1.0, { damage: false });
        killFlyer(it.target, true, it.owner);
      } else {
        explode(it.group.position.clone().add(new THREE.Vector3(rnd(-6, 6), rnd(-3, 5), rnd(-6, 6))), 0.6, { damage: false });
        log(L('lg_miss', it.owner, it.target.name), 'warn');
      }
      updateStats();
      scene.remove(it.group);
      G.interceptors.splice(i, 1);
    }
  }
}
function updateBursts(dt) {
  for (let bi = G.bursts.length - 1; bi >= 0; bi--) {
    const b = G.bursts[bi];
    b.t += dt;
    if (b.t >= b.interval && b.idx < b.shots) {
      b.t = 0;
      const p = b.owner;
      if (!b.target.alive) { G.bursts.splice(bi, 1); continue; }
      p.gunG.updateWorldMatrix(true, true);
      const muzzle = new THREE.Vector3(b.idx % 2 ? 0.38 : -0.38, 0.1, 3.1);
      p.gunG.localToWorld(muzzle);
      const aim = b.target.group.position.clone();
      const converge = b.hitDecided && b.idx >= 2;
      if (!converge) aim.add(new THREE.Vector3(rnd(-3.5, 3.5), rnd(-2.5, 2.5), rnd(-3.5, 3.5)));
      spawnTracer(muzzle, aim);
      spawnFire(muzzle, 1.0);
      Sound.gun();
      shake = Math.min(1.8, shake + 0.02);
      if (converge && b.idx === 3) {
        b.target.hp -= 25;
        spawnSparks(b.target.group.position.clone(), 6, 8, true);
        if (b.target.hp <= 0) {
          killFlyer(b.target, true, p.name);
          G.stats.hits++;
          updateStats();
        }
      }
      b.idx++;
    }
    if (b.idx >= b.shots) G.bursts.splice(bi, 1);
  }
}
function spawnTracer(from, to) {
  const len = from.distanceTo(to);
  const geo = new THREE.CylinderGeometry(0.06, 0.06, len, 3, 1, true);
  geo.translate(0, len / 2, 0);
  geo.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: 0xffd070, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  m.position.copy(from);
  m.lookAt(to);
  scene.add(m);
  G.tracers.push({ mesh: m, t: 0, max: 0.14 });
}
function updateParticles(dt) {
  for (let i = G.smokes.length - 1; i >= 0; i--) {
    const p = G.smokes[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.spr); p.spr.material.dispose(); G.smokes.splice(i, 1); continue; }
    p.spr.position.addScaledVector(p.vel, dt);
    p.spr.position.addScaledVector(WIND, dt * 0.7);
    p.vel.multiplyScalar(Math.pow(p.drag, dt * 60));
    const s = p.spr.scale.x + p.grow * dt;
    p.spr.scale.set(s, s, 1);
    p.spr.material.opacity = p.op * (p.life / p.max);
  }
  for (let i = G.fires.length - 1; i >= 0; i--) {
    const p = G.fires[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.spr); p.spr.material.dispose(); G.fires.splice(i, 1); continue; }
    p.spr.position.addScaledVector(p.vel, dt);
    const s = Math.max(0.1, p.spr.scale.x + p.grow * dt);
    p.spr.scale.set(s, s, 1);
    p.spr.material.opacity = p.life / p.max;
  }
  for (let i = G.sparks.length - 1; i >= 0; i--) {
    const p = G.sparks[i];
    p.life -= dt;
    p.vel.y -= p.grav * dt;
    p.spr.position.addScaledVector(p.vel, dt);
    if (p.bounce && p.spr.position.y < 0.15) {
      p.spr.position.y = 0.15;
      p.vel.y *= -0.3; p.vel.x *= 0.6; p.vel.z *= 0.6;
    }
    if (p.life <= 0) { scene.remove(p.spr); p.spr.material.dispose(); G.sparks.splice(i, 1); continue; }
    p.spr.material.opacity = clamp(p.life / p.max, 0, 1);
  }
  for (let i = G.rings.length - 1; i >= 0; i--) {
    const r = G.rings[i];
    r.t += dt;
    const k = r.t / r.max;
    if (k >= 1) { scene.remove(r.mesh); r.mesh.geometry.dispose(); r.mesh.material.dispose(); G.rings.splice(i, 1); continue; }
    const s = lerp(r.s0, r.s1, 1 - (1 - k) * (1 - k));
    r.mesh.scale.set(s, s, s);
    r.mesh.material.opacity = (1 - k) * 0.8;
  }
  for (let i = G.balls.length - 1; i >= 0; i--) {
    const b = G.balls[i];
    b.t += dt;
    const k = b.t / b.max;
    if (k >= 1) { scene.remove(b.mesh); b.mesh.geometry.dispose(); b.mesh.material.dispose(); G.balls.splice(i, 1); continue; }
    const s = lerp(b.s0, b.s1, 1 - (1 - k) * (1 - k));
    b.mesh.scale.set(s, s, s);
    b.mesh.material.opacity = (1 - k) * 0.9;
  }
  for (let i = G.flashes.length - 1; i >= 0; i--) {
    const f = G.flashes[i];
    f.t += dt;
    const k = f.t / f.max;
    if (k >= 1) { scene.remove(f.light); G.flashes.splice(i, 1); continue; }
    f.light.intensity = f.i0 * (1 - k) * (1 - k);
  }
  for (let i = G.debris.length - 1; i >= 0; i--) {
    const d = G.debris[i];
    d.t += dt;
    if (!d.settled) {
      d.vel.y -= 22 * dt;
      d.mesh.position.addScaledVector(d.vel, dt);
      d.mesh.rotation.x += d.ang.x * dt;
      d.mesh.rotation.y += d.ang.y * dt;
      d.mesh.rotation.z += d.ang.z * dt;
      if (d.mesh.position.y < 0.3) {
        d.mesh.position.y = 0.3;
        if (Math.abs(d.vel.y) > 3) {
          d.vel.y *= -0.35; d.vel.x *= 0.6; d.vel.z *= 0.6;
        } else {
          d.settled = true; d.vel.set(0, 0, 0); d.ang.set(0, 0, 0);
        }
      }
      if (d.burn > 0) {
        d.burn -= dt;
        if (chance(0.3)) spawnSmoke(d.mesh.position.clone(), { size: rnd(0.5, 1), life: 1, color: 0x222222, grow: 1.5 });
        if (chance(0.2)) spawnFire(d.mesh.position.clone(), 0.7);
      }
    } else if (d.t > 26) {
      scene.remove(d.mesh); d.mesh.geometry.dispose(); d.mesh.material.dispose(); G.debris.splice(i, 1);
    }
  }
  for (let i = G.tracers.length - 1; i >= 0; i--) {
    const t = G.tracers[i];
    t.t += dt;
    if (t.t >= t.max) { scene.remove(t.mesh); t.mesh.geometry.dispose(); t.mesh.material.dispose(); G.tracers.splice(i, 1); continue; }
    t.mesh.material.opacity = 0.9 * (1 - t.t / t.max);
  }
  for (let i = G.emitters.length - 1; i >= 0; i--) {
    const e = G.emitters[i];
    e.t += dt;
    if (e.t > e.life) { G.emitters.splice(i, 1); continue; }
    if (e.structId) {
      const st = G.structById[e.structId];
      if (st && !st.alive) { G.emitters.splice(i, 1); continue; }
    }
    e.acc += e.rate * dt;
    while (e.acc > 1) {
      e.acc -= 1;
      if (e.type === 'smoke') {
        spawnSmoke(e.pos.clone().add(new THREE.Vector3(rnd(-0.6, 0.6), rnd(0, 0.6), rnd(-0.6, 0.6))),
          { color: e.color || 0x2a2a2a, size: rnd(1.5, 3), life: rnd(2.5, 4), grow: 3, op: 0.62, vel: new THREE.Vector3(rnd(-0.5, 0.5), rnd(3, 5), rnd(-0.5, 0.5)) });
      } else if (e.type === 'steam') {
        spawnSmoke(e.pos.clone().add(new THREE.Vector3(rnd(-2, 2), 0, rnd(-2, 2))),
          { color: e.color, size: rnd(2.5, 4), life: rnd(3, 5), grow: 3.5, op: 0.4, vel: new THREE.Vector3(rnd(-0.4, 0.4), rnd(3, 4.5), rnd(-0.4, 0.4)) });
      } else {
        spawnFire(e.pos.clone().add(new THREE.Vector3(rnd(-0.8, 0.8), rnd(-0.3, 0.3), rnd(-0.8, 0.8))), rnd(1.5, 2.8));
      }
    }
  }
  G.structures.forEach(s => {
    if (!s.alive && s.falling) {
      const f = s.falling;

      if (chance(0.25)) {

          { size: rnd(2, 4), life: 2, color: 0x6a6258, grow: 4 });

      if (f.angle > 1.42) {
        s.group.visible = false;
        spawnChunks(s, f.box, true);
        Sound.crumble();
        shake = Math.min(1.8, shake + 0.45);
        spawnRing(s.group.position.clone().setY(1), 2.0, false);
        for (let i = 0; i < 10; i++) {

}
function updateWaves(dt) {

let dragging = false, moved = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
let lastHoverT = 0, hoverDirty = false;
/* v7.1: мультитач-реестр и pinch-zoom */
const pointers = new Map();
let pinching = false, pinchD0 = 0, pinchCam0 = 0, pinchGar0 = 0;
const pdist = () => {
  const a = [...pointers.values()];
  return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
};
if (renderer) {
  const el = renderer.domElement;
  el.style.cursor = 'crosshair';
  el.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      pinching = true; dragging = false; moved = true;
      pinchD0 = pdist(); pinchCam0 = camDist; pinchGar0 = G.garageDist;
      return;
    }
    if (G.garageOpen) { dragging = true; lastX = e.clientX; lastY = e.clientY; el.style.cursor = 'grabbing'; return; }
    dragging = true; moved = false;
    lastX = downX = e.clientX;
    lastY = downY = e.clientY;
    el.style.cursor = 'grabbing';
    lastInteract = performance.now();
  });
  window.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    if (pinching && pointers.size >= 2) {
      const d = Math.max(40, pdist());
      if (G.garageOpen) G.garageDist = clamp(pinchGar0 * pinchD0 / d, 6, 40);
      else camDist = clamp(pinchCam0 * pinchD0 / d, 60, 460);
      lastInteract = performance.now();
      return;
    }
    if (G.garageOpen) {
      if (dragging) {
        G.garageYaw -= (e.clientX - lastX) * 0.008;
        G.garagePitch = clamp(G.garagePitch - (e.clientY - lastY) * 0.005, 0.08, 1.2);
        lastX = e.clientX; lastY = e.clientY;
      }
      return;
    }
    hoverDirty = true;
    if (dragging) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      const thr = IS_TOUCH ? 12 : 7;
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > thr) moved = true;
      camTheta -= dx * 0.005;
      camPhi = clamp(camPhi - dy * 0.004, 0.22, 1.32);
      lastX = e.clientX; lastY = e.clientY;
      lastInteract = performance.now();
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      const r = [...pointers.values()][0];
      lastX = r.x; lastY = r.y;
      moved = true; pinching = false;
      return;
    }
    if (pointers.size === 0) {
      pinching = false;
      if (e.type === 'pointerup' && !moved && G.running && !G.paused && !G.garageOpen && e.target === el) {
        ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
        ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
        updateHover();
        handleClick();
      }
      dragging = false;
      el.style.cursor = G.garageOpen ? 'grab' : 'crosshair';
    }
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  el.addEventListener('wheel', e => {
    e.preventDefault();
    if (G.garageOpen) { G.garageDist = clamp(G.garageDist * (1 + e.deltaY * 0.001), 6, 40); return; }
    camDist = clamp(camDist * (1 + e.deltaY * 0.001), 60, 460);
    lastInteract = performance.now();
  }, { passive: false });
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function groundPointFromNDC() {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(groundMesh, false);
  return hits.length ? hits[0].point.clone() : null;
}
function structFromHit(hits) {
  for (let i = 0; i < hits.length; i++) {
    let o = hits[i].object;
    while (o) {
      if (o.userData && o.userData.sid) {
        const s = G.structById[o.userData.sid];
        if (s && s.alive) return s;
      }
      o = o.parent;
    }
  }
  return null;
}
function refreshHint() {
  const hint = $('hint');
  if (!hint || !G.running) return;
  if (G.mode === 'pvo') {
    hint.textContent = L('hint_pvo', pname(G.selPvo));
    hint.classList.remove('lock');
  } else if (!hint.classList.contains('lock')) {
    hint.textContent = L('hint_attack', uname(G.selUnit));
  }
}
function updateHover() {
  if (!G.running || !groundMesh || G.paused) return;
  if (G.mode === 'attack') {
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(G.structGroups, true);
    const s = structFromHit(hits);
    if (s !== G.hoverStruct) {
      G.hoverStruct = s;
      if (s) { setMarker(s); Sound.lock(); }
      else G.marker.visible = false;
    }
    const p = groundPointFromNDC();
    if (p) G.groundPoint.copy(p);
    G.reticle.visible = !s && !!p;
    if (G.reticle.visible) G.reticle.position.set(p.x, 0.15, p.z);
    G.ghost.visible = false;
    const hint = $('hint');
    if (s) {
      hint.textContent = L('hint_lock', s.name, uname(G.selUnit));
      hint.classList.add('lock');
    } else {
      hint.textContent = L('hint_attack', uname(G.selUnit));
      hint.classList.remove('lock');
    }
  } else {
    G.hoverStruct = null;
    if (G.marker) G.marker.visible = false;
    if (G.reticle) G.reticle.visible = false;
    const p = groundPointFromNDC();
    if (p) { G.groundPoint.copy(p); G.ghost.visible = true; G.ghost.position.set(p.x, 0, p.z); }
    else G.ghost.visible = false;
    refreshHint();
  }
}
function handleClick() {
  if (G.mode === 'pvo') {
    const p = groundPointFromNDC();
    if (!p) return;
    if (Math.abs(p.x) > WORLD_R || Math.abs(p.z) > WORLD_R) { log(L('lg_out'), 'bad'); return; }
    placePvo(G.selPvo, p);
    return;
  }
  if (G.hoverStruct) {
    launchAttack(G.selUnit, G.hoverStruct.group.position.clone(), G.hoverStruct.id);
    G.marker.visible = false;
    G.hoverStruct = null;
  } else {
    const p = groundPointFromNDC();
    if (!p) return;
    launchAttack(G.selUnit, p, null);
  }
}
